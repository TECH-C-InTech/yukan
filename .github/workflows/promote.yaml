---
name: promote

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "prod へ昇格するコミット SHA (staging で検証済みのもの。省略時は main の HEAD)"
        required: false
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: asia-northeast1-docker.pkg.dev/yukan-discord-bot/yukan-bot/discord-yukan

jobs:
  promote-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          service_account: ${{ vars.DEPLOY_SA }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: false

      - name: Deploy to prod
        env:
          INPUT_SHA: ${{ inputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          SHA="${INPUT_SHA:-$HEAD_SHA}"
          gcloud run deploy discord-yukan \
            --image "$IMAGE:$SHA" \
            --region asia-northeast1 \
            --project yukan-discord-bot \
            --quiet
